<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Visit | ACHI Scaffolding ERP</title>
  <!-- Same design as the CRM page: its stylesheet, then this page's grid/tabs/form. -->
  <link rel="stylesheet" href="/api/v1/achi/crm/crm.css?v=28">
  <link rel="stylesheet" href="/api/v1/achi/site-visit/site_visit.css?v=3">
</head>
<body data-achi-title="Site Visit">
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
  </svg>

  <main class="pg sv-page" id="pg">
    <!-- Banner: title, search, refresh, (delete N selected), + New visit -->
    <div class="bar">
      <h1>Site visit</h1>
      <span style="flex:1"></span>
      <label class="srch-wrap" for="sv-search"><svg><use href="#i-search"/></svg><input class="srch" type="search" id="sv-search" placeholder="Search SV, ENQ, contact, site…" autocomplete="off"></label>
      <button class="mini" type="button" id="sv-refresh" title="Refresh"><svg><use href="#i-refresh"/></svg></button>
      <button class="mini sv-del" type="button" id="sv-delete" hidden><svg><use href="#i-trash"/></svg>Delete <span id="sv-del-count">1</span> selected</button>
      <button class="mini solid" type="button" id="sv-new"><svg><use href="#i-plus"/></svg>New visit</button>
    </div>

    <!-- Quick views as counter chips, like the Log page's (number, then label). -->
    <div class="kchips sv-tabs" id="sv-tabs" role="group" aria-label="Site visit view">
      <button type="button" class="kc sv-tab on" data-tab="all"><b data-count="all">0</b> Site visits</button>
      <button type="button" class="kc sv-tab" data-tab="todo"><b data-count="todo">0</b> To do</button>
      <button type="button" class="kc sv-tab" data-tab="progress"><b data-count="progress">0</b> In progress</button>
      <button type="button" class="kc sv-tab" data-tab="done"><b data-count="done">0</b> Done</button>
    </div>

    <div class="wrap">
      <div class="hd" id="sv-hd"></div>
      <div id="sv-rows"><div class="row"><div class="empty">Loading…</div></div></div>
      <div class="foot" id="sv-foot"></div>
    </div>
  </main>

  <!-- + New visit (a visit with no enquiry behind it) -->
  <div class="sv-modal-backdrop" id="sv-modal" hidden>
    <section class="sv-modal" role="dialog" aria-modal="true" aria-labelledby="sv-modal-title">
      <header class="sv-modal-head">
        <h2 id="sv-modal-title">New site visit</h2>
        <button class="sv-modal-x" type="button" id="sv-modal-close" aria-label="Close" title="Close"><svg><use href="#i-x"/></svg></button>
      </header>
      <form id="sv-form" novalidate>
        <div class="sv-form-grid">
          <label class="span-2">Contact <i>*</i><input name="contact_name" maxlength="255" autocomplete="off" required></label>
          <label>Mobile / WA<input name="mobile" maxlength="32" inputmode="tel" autocomplete="off"></label>
          <label>Visit date<input name="survey_date" type="date"></label>
          <label class="span-2">Site<input name="site" maxlength="255" autocomplete="off" placeholder="City — site location"></label>
          <label>Surveyor<input name="assigned_to" maxlength="255" autocomplete="off"></label>
          <label>Status<select name="status" id="sv-form-status"></select></label>
        </div>
        <p class="sv-form-error" id="sv-form-error" role="alert"></p>
        <div class="sv-form-actions">
          <button class="mini ghost" type="button" id="sv-form-cancel">Cancel</button>
          <button class="mini solid" type="submit" id="sv-form-save">Add visit</button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/api/v1/achi/site-visit/site_visit.js?v=2"></script>
  <script src="/api/v1/achi/ui/chrome.js?v=43"></script>
</body>
</html>
