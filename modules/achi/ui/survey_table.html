<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Visit | ARARA</title>
  <!-- Site Visit list (every SV-NNNNN). Same look as CRM / Contacts: reuses the CRM
       sheet. Served at /survey/ui (no ?id) and /site-visit/ui; a row opens
       /survey/ui?id=… (the full visit form). -->
  <link rel="stylesheet" href="/api/v1/achi/crm/crm.css?v=35">
  <style>
    /* Column set for this page (resizable; crm.css reads --crm-cols). */
    #pg { --crm-cols: 92px 84px 128px 92px minmax(150px, 1.2fr) minmax(170px, 1.4fr) 150px 92px 88px; --crm-minw: 1120px; }
    .sv-st { font: inherit; font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border: 0; border-radius: 999px; padding: 3px 8px; cursor: pointer; appearance: none; -webkit-appearance: none; }
    .sv-st:focus { outline: none; box-shadow: 0 0 0 2px rgba(40, 79, 158, .2); }
    .sv-mini { color: var(--mut); font-size: 10.5px; }
    .sv-enq { font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 700; color: var(--navy); }
    .sv-empty { padding: 26px 14px; text-align: center; color: var(--mut); }
    .sv-ck { flex: 0 0 auto; width: 13px; height: 13px; margin: 0 6px 0 0; vertical-align: -2px; accent-color: var(--navy); cursor: pointer; }
    .mini.danger { background: #fff; border-color: #f1b8b3; color: #b42318; }
    .mini.danger:hover { background: #fbeaea; }
  </style>
</head>
<body data-achi-title="Site Visit">
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
  </svg>

  <main class="pg" id="pg">
    <div class="bar">
      <h1>Site Visit</h1>
      <span style="flex:1"></span>
      <label class="srch-wrap" for="sv-search"><svg><use href="#i-search"/></svg><input class="srch" type="search" id="sv-search" placeholder="Search SV, ENQ, client, site…" autocomplete="off"></label>
      <button class="mini danger" type="button" id="sv-del" hidden>Delete</button>
      <button class="mini" type="button" id="sv-refresh" title="Refresh"><svg><use href="#i-refresh"/></svg></button>
      <button class="mini" type="button" id="sv-new"><svg><use href="#i-plus"/></svg>New visit</button>
    </div>

    <div class="kchips" id="kchips"></div>

    <div class="wrap" id="list-wrap">
      <div class="hd" id="hd"></div>
      <div id="rows"></div>
      <div class="foot" id="foot"></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script>
/* Site Visit — every visit (SV-NNNNN) in one list, CRM/Contacts look.
 * A visit opens by itself when an enquiry reaches the "Site visit" stage (Log
 * intent SV, CRM stage dropdown / board, or a New ENQ saved at that stage);
 * "New visit" opens one by hand. A row opens the full visit form (photos,
 * measurements, sketch, "I'm on site"). Status changes inline. */
(function () {
  'use strict';

  const API = '/api/v1/achi';
  const $ = id => document.getElementById(id);
  const esc = value => String(value == null ? '' : value).replace(
    /[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]),
  );

  // ── Auth (unchanged — the OCE shell's bearer token, refreshed on 401) ──────
  const isJwt = value => typeof value === 'string' && /^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(value);

  function jwtPayload(token) {
    try {
      let payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (payload.length % 4) payload += '=';
      return JSON.parse(atob(payload));
    } catch (_error) {
      return null;
    }
  }

  const isAccessJwt = value => isJwt(value) && (jwtPayload(value) || {}).type !== 'refresh';

  function scanStorage(match) {
    for (const storage of [localStorage, sessionStorage]) {
      for (let index = 0; index < storage.length; index += 1) {
        const value = storage.getItem(storage.key(index));
        if (match(value)) return value;
        if (value && value[0] === '{') {
          try {
            const parsed = JSON.parse(value);
            const candidates = [
              parsed.access_token, parsed.refresh_token, parsed.token,
              parsed.state && parsed.state.access_token,
              parsed.state && parsed.state.refresh_token,
              parsed.state && parsed.state.token,
            ];
            for (const candidate of candidates) if (match(candidate)) return candidate;
          } catch (_error) { /* ignore unrelated storage entries */ }
        }
      }
    }
    return null;
  }

  function getAccessToken() {
    const direct = localStorage.getItem('oe_access_token');
    return isAccessJwt(direct) ? direct : scanStorage(isAccessJwt);
  }

  function getRefreshToken() {
    const direct = localStorage.getItem('oe_refresh_token');
    if (isJwt(direct)) return direct;
    return scanStorage(value => isJwt(value) && (jwtPayload(value) || {}).type === 'refresh');
  }

  let accessToken = getAccessToken();
  let refreshPromise = null;

  async function refreshAccessToken() {
    if (refreshPromise) return refreshPromise;
    const refreshToken = getRefreshToken();
    if (!refreshToken) return false;
    refreshPromise = fetch('/api/v1/users/auth/refresh/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken }),
    })
      .then(response => (response.ok ? response.json() : null))
      .then(payload => {
        if (!payload || !payload.access_token) return false;
        accessToken = payload.access_token;
        localStorage.setItem('oe_access_token', accessToken);
        if (payload.refresh_token) localStorage.setItem('oe_refresh_token', payload.refresh_token);
        return true;
      })
      .catch(() => false)
      .finally(() => { refreshPromise = null; });
    return refreshPromise;
  }

  async function request(path, options = {}, retried = false) {
    const headers = { Authorization: `Bearer ${accessToken || ''}`, ...(options.headers || {}) };
    const init = { ...options, headers };
    if (init.body && typeof init.body !== 'string') {
      headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(init.body);
    }
    const response = await fetch(path, init);
    if (response.status === 401 && !retried && await refreshAccessToken()) return request(path, options, true);
    if (response.status === 204) return null;
    const body = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = Array.isArray(body.detail)
        ? body.detail.map(item => item.msg || String(item)).join('; ')
        : body.detail;
      const error = new Error(detail || `Request failed (${response.status})`);
      error.status = response.status;
      throw error;
    }
    return body;
  }

  let toastTimer = null;
  function showToast(message, isError) {
    const toast = $('toast');
    window.clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.toggle('is-error', Boolean(isError));
    toast.hidden = false;
    toastTimer = window.setTimeout(() => { toast.hidden = true; }, 3200);
  }

  // Mirrors schemas.SURVEY_STATUSES.
  const STATUSES = ['Draft', 'Scheduled', 'In Progress', 'Completed', 'Cancelled'];
  const ST_STYLE = {
    Draft: 'background:#eaf1ff;color:#1F3F80',
    Scheduled: 'background:#fff4e0;color:#8a5a08',
    'In Progress': 'background:#f3edfb;color:#5b21b6',
    Completed: 'background:#dcefe2;color:#14532d',
    Cancelled: 'background:#fbeaea;color:#b91c1c',
  };
  const enqCode = fileNumber => {
    const raw = String(fileNumber || '').trim();
    const match = raw.match(/-(\d+)$/);
    return match ? `ENQ-${match[1].padStart(5, '0')}` : raw;
  };
  const fmtDate = d => {
    if (!d) return '';
    const [y, m, day] = String(d).slice(0, 10).split('-');
    return day ? `${day}/${m}/${y}` : String(d);
  };

  // Visit codes are SV-NNNNN; older ones stored as ACHI-SV-YYYY-NNNNN show the same way.
  const svCode = n => String(n || '').replace(/^ACHI-SV-\d{4}-(\d+)$/, 'SV-$1');

  const state = { all: [], q: '', st: '', picked: new Set() };

  const COLS = ['Code', 'Visit date', 'Status', 'ENQ', 'Contact', 'Site', 'Mobile / WA', 'Surveyor', 'Captured'];

  function renderHead() {
    const opts = ['<option value="">All statuses</option>']
      .concat(STATUSES.map(s => `<option value="${esc(s)}"${state.st === s ? ' selected' : ''}>${esc(s)}</option>`)).join('');
    const shown = visible();
    const allOn = shown.length > 0 && shown.every(r => state.picked.has(r.id));
    $('hd').innerHTML = COLS.map((h, i) => (i === 0
      ? `<span><input type="checkbox" class="sv-ck" id="sv-all" title="Select all shown"${allOn ? ' checked' : ''}>${esc(h)}</span>`
      : i === 2
      ? `<span class="flt${state.st ? ' on' : ''}">Status <i class="farr">▾</i>${state.st ? ' · ' + esc(state.st) : ''}<select class="stover" id="sv-fst" title="Filter by status">${opts}</select></span>`
      : `<span>${esc(h)}</span>`)).join('');
    Array.from($('hd').children).forEach((cell, i) => {
      cell.insertAdjacentHTML('beforeend', `<i class="rz" data-i="${i}" title="Drag to resize · double-click to reset"></i>`);
    });
  }

  function statusCell(r) {
    const opts = STATUSES.map(s => `<option${s === r.status ? ' selected' : ''}>${esc(s)}</option>`).join('');
    return `<select class="sv-st" data-status="${esc(r.id)}" style="${ST_STYLE[r.status] || ''}" aria-label="Status">${opts}</select>`;
  }
  // Site opens Google Maps, like the Log: the saved Maps link when there is
  // one, else a Maps search for the site location / city.
  function siteCell(r) {
    const site = r.site_location || r.city || '';
    if (!site) return '';
    const maps = [r.google_maps_url, r.maps_url].find(u => u && /^https?:\/\//i.test(u));
    const q = [r.site_location, r.city].filter(Boolean).join(', ');
    const url = maps || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    return `<a class="site-lnk" href="${esc(url)}" target="_blank" rel="noopener" title="Open in Google Maps">`
      + `<svg aria-hidden="true"><use href="#i-pin"/></svg><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(site)}</span></a>`;
  }
  function rowHTML(r) {
    const mobile = r.lead_mobile || '';
    const digits = mobile.replace(/[^\d]/g, '');
    const contact = r.contact || r.lead_name || r.customer || r.lead_company || '';
    const captured = [r.photo_count ? `${r.photo_count} 📷` : '', r.measurement_count ? `${r.measurement_count} m` : '', r.has_drawing ? '✎' : '']
      .filter(Boolean).join(' · ');
    const on = state.picked.has(r.id);
    return `<div class="row${on ? ' sel' : ''}" data-open="${esc(r.id)}" title="Open the full visit">`
      + `<div><input type="checkbox" class="sv-ck" data-pick="${esc(r.id)}" aria-label="Select"${on ? ' checked' : ''}><span class="code">${esc(svCode(r.survey_number))}</span></div>`
      + `<div class="num" style="font-size:10.5px">${esc(fmtDate(r.survey_date)) || '<span class="mut">not set</span>'}</div>`
      + `<div>${statusCell(r)}</div>`
      + `<div>${(r.file_number || /^ENQ-\d+$/.test(r.lead || '')) ? `<a class="sv-enq" href="${API}/crm/ui" title="Open CRM">${esc(r.file_number ? enqCode(r.file_number) : r.lead)}</a>` : '<span class="mut">—</span>'}</div>`
      + `<div><span class="nm-main" title="${esc(contact)}">${esc(contact)}</span></div>`
      + `<div>${siteCell(r)}</div>`
      + `<div>${mobile ? `<span class="num">${esc(mobile)}</span>${digits ? ` <a class="wa" href="https://wa.me/${digits}" target="_blank" rel="noopener" title="Open in WhatsApp">WA</a>` : ''}` : ''}</div>`
      + `<div title="${esc(r.assigned_to || '')}">${esc(r.assigned_to || '')}</div>`
      + `<div class="sv-mini">${captured || '—'}</div>`
      + '</div>';
  }

  function visible() {
    let list = state.all;
    if (state.st) list = list.filter(r => r.status === state.st);
    if (state.q) {
      list = list.filter(r => [svCode(r.survey_number), r.survey_number, enqCode(r.file_number), r.customer, r.lead_company, r.contact, r.lead_name,
        r.lead_mobile, r.site_location, r.city, r.assigned_to, r.notes].filter(Boolean).join(' ').toLowerCase().includes(state.q));
    }
    return list;
  }

  function render() {
    renderHead();
    const list = visible();
    const n = s => state.all.filter(r => r.status === s).length;
    $('kchips').innerHTML = `<span class="kc"><b>${state.all.length}</b> site visits</span>`
      + `<span class="kc"><b>${n('Scheduled') + n('Draft')}</b> to do</span>`
      + `<span class="kc"><b>${n('In Progress')}</b> in progress</span>`
      + `<span class="kc"><b>${n('Completed')}</b> done</span>`;
    $('rows').innerHTML = list.length ? list.map(rowHTML).join('')
      : `<div class="sv-empty">${state.all.length ? 'No site visits match the current filters.'
        : 'No site visits yet — move an enquiry to the “Site visit” stage (CRM or Log intent SV) and it appears here.'}</div>`;
    const del = $('sv-del');
    del.hidden = !state.picked.size;
    del.textContent = `Delete ${state.picked.size} selected`;
    $('foot').innerHTML = `<span>${list.length} shown</span><span style="flex:1"></span><span>click a line to open the visit — status changes inline</span>`;
  }

  async function load() {
    try {
      state.all = await request(`${API}/surveys/?limit=1000`) || [];
      const ids = new Set(state.all.map(r => r.id));
      state.picked.forEach(id => { if (!ids.has(id)) state.picked.delete(id); });
      render();
    } catch (error) {
      $('rows').innerHTML = `<div class="sv-empty">Couldn’t load site visits: ${esc(error.message || 'error')}</div>`;
      return;
    }
    catchUp();
  }

  // Enquiries sitting at the "Site visit" stage without a visit (moved there
  // before visits opened automatically) get one here — tagged with their ENQ
  // code like the Log / CRM do, so nothing is ever opened twice.
  let catching = false;
  async function catchUp() {
    if (catching) return;
    catching = true;
    try {
      const files = new Map();
      for (let offset = 0; offset < 20000;) {
        const data = await request(`${API}/logs/?stage=site_survey&limit=1000&offset=${offset}`);
        const items = (data && data.items) || [];
        items.forEach(r => { if (r.stage === 'site_survey' && !files.has(r.file_id)) files.set(r.file_id, r); });
        offset += items.length;
        if (!items.length || offset >= ((data && data.total) || 0)) break;
      }
      const have = new Set();
      state.all.forEach(v => { if (v.file_id) have.add(v.file_id); if (/^ENQ-\d+$/.test(v.lead || '')) have.add(v.lead); });
      let opened = 0;
      for (const [fid, r] of files) {
        const code = enqCode(r.file_number);
        if (have.has(fid) || have.has(code)) continue;
        const person = [r.prefix, r.first_name, r.last_name].filter(Boolean).join(' ') || r.contact_name || '';
        await request(`${API}/surveys/`, { method: 'POST', body: {
          status: 'Scheduled', lead: code || null, customer: r.company_name || person || null, contact: person || null,
          site_location: [r.site_location, r.city].filter(Boolean).join(', ') || null,
          google_maps_url: r.maps_url || null, notes: r.subject || null,
        } });
        have.add(code);
        opened += 1;
      }
      if (opened) {
        state.all = await request(`${API}/surveys/?limit=1000`) || [];
        render();
        showToast(`${opened} site visit${opened > 1 ? 's' : ''} opened for enquiries already at the Site visit stage.`);
      }
    } catch (_e) { /* the list above is still right; try again next load */ }
    finally { catching = false; }
  }

  // ── Resizable columns (same behaviour as CRM) ─────────────────────────────
  const COLW_KEY = 'achi.sv.colW';
  let colW = null;
  try {
    const saved = JSON.parse(localStorage.getItem(COLW_KEY) || 'null');
    if (Array.isArray(saved) && saved.length === COLS.length && saved.every(w => Number.isFinite(w) && w >= 36)) colW = saved;
  } catch (_e) { colW = null; }
  function applyColW() {
    const pg = $('pg');
    if (!colW) { pg.style.removeProperty('--crm-cols'); pg.style.removeProperty('--crm-minw'); return; }
    pg.style.setProperty('--crm-cols', colW.map(w => `${Math.round(w)}px`).join(' '));
    pg.style.setProperty('--crm-minw', `${Math.round(colW.reduce((a, b) => a + b, 0))}px`);
  }
  function saveColW() {
    try {
      if (colW) localStorage.setItem(COLW_KEY, JSON.stringify(colW.map(Math.round)));
      else localStorage.removeItem(COLW_KEY);
    } catch (_e) { /* private mode */ }
  }
  applyColW();
  $('hd').addEventListener('pointerdown', event => {
    const grip = event.target.closest('.rz');
    if (!grip || event.button !== 0) return;
    event.preventDefault();
    colW = Array.from($('hd').children).map(c => c.getBoundingClientRect().width);
    const i = Number(grip.dataset.i);
    const startX = event.clientX;
    const startW = colW[i];
    document.body.classList.add('col-resizing');
    const move = e => { colW[i] = Math.max(36, startW + e.clientX - startX); applyColW(); };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      document.body.classList.remove('col-resizing');
      saveColW();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
  $('hd').addEventListener('dblclick', event => {
    if (!event.target.closest('.rz')) return;
    colW = null; applyColW(); saveColW();
  });

  // ── Events ────────────────────────────────────────────────────────────────
  $('hd').addEventListener('change', event => {
    if (event.target.id === 'sv-fst') { state.st = event.target.value; render(); }
    if (event.target.id === 'sv-all') {
      visible().forEach(r => (event.target.checked ? state.picked.add(r.id) : state.picked.delete(r.id)));
      render();
    }
  });
  $('rows').addEventListener('change', async event => {
    const pick = event.target.closest('[data-pick]');
    if (pick) {
      if (pick.checked) state.picked.add(pick.dataset.pick); else state.picked.delete(pick.dataset.pick);
      render();
      return;
    }
    const sel = event.target.closest('[data-status]');
    if (!sel) return;
    sel.setAttribute('style', ST_STYLE[sel.value] || '');
    try {
      await request(`${API}/surveys/${encodeURIComponent(sel.dataset.status)}`, { method: 'PATCH', body: { status: sel.value } });
      const r = state.all.find(x => x.id === sel.dataset.status);
      if (r) r.status = sel.value;
      render();
      showToast('Status updated.');
    } catch (error) {
      showToast(error.message || 'Could not update the status.', true);
      load();
    }
  });
  $('rows').addEventListener('click', event => {
    if (event.target.closest('a, select, input')) return;
    const row = event.target.closest('[data-open]');
    if (row) window.location.href = `${API}/survey/ui?id=${encodeURIComponent(row.dataset.open)}`;
  });
  $('sv-search').addEventListener('input', event => { state.q = event.target.value.trim().toLowerCase(); render(); });
  $('sv-refresh').addEventListener('click', load);
  $('sv-del').addEventListener('click', async () => {
    const picked = state.all.filter(r => state.picked.has(r.id));
    if (!picked.length) return;
    const names = picked.slice(0, 5).map(r => svCode(r.survey_number)).join(', ') + (picked.length > 5 ? ` and ${picked.length - 5} more` : '');
    if (!window.confirm(`Delete ${picked.length} site visit${picked.length > 1 ? 's' : ''} (${names})? Photos and measurements go with them. This cannot be undone.`)) return;
    const btn = $('sv-del');
    btn.disabled = true;
    let failed = 0;
    for (const r of picked) {
      try {
        await request(`${API}/surveys/${encodeURIComponent(r.id)}`, { method: 'DELETE' });
        state.picked.delete(r.id);
      } catch (_error) { failed += 1; }
    }
    btn.disabled = false;
    await load();
    showToast(failed ? `${failed} site visit${failed > 1 ? 's' : ''} could not be deleted.` : `Deleted ${picked.length} site visit${picked.length > 1 ? 's' : ''}.`, Boolean(failed));
  });
  // New visit by hand: a Draft dated today, then straight into its full form.
  $('sv-new').addEventListener('click', async () => {
    const btn = $('sv-new');
    btn.disabled = true;
    try {
      const d = new Date();
      const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const s = await request(`${API}/surveys/`, { method: 'POST', body: { status: 'Draft', survey_date: today } });
      window.location.href = `${API}/survey/ui?id=${encodeURIComponent(s.id)}`;
    } catch (error) {
      showToast(error.message || 'Could not open a new visit.', true);
      btn.disabled = false;
    }
  });

  render();
  load();
})();
  </script>
<script src="/api/v1/achi/ui/chrome.js?v=52"></script>
</body>
</html>
