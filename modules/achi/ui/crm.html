<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM | ACHI Scaffolding ERP</title>
  <link rel="stylesheet" href="/api/v1/achi/crm/crm.css?v=6">
</head>
<body data-achi-title="CRM">
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7L20 14"/><path d="M20 5v6h-6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
  </svg>

  <main class="crm-page">
    <header class="page-header">
      <div>
        <p class="breadcrumb">ACHI / CRM</p>
        <h1>CRM</h1>
        <p class="page-description">Prospects, leads and enquiries</p>
      </div>
      <div class="header-actions">
        <button class="icon-button" type="button" id="refresh-button" aria-label="Refresh CRM" title="Refresh"><svg><use href="#i-refresh"/></svg></button>
        <button class="button button-primary" type="button" id="new-prospect-button"><svg><use href="#i-plus"/></svg>New Prospect</button>
      </div>
    </header>

    <section class="workspace">
      <div class="workspace-toolbar">
        <span class="crm-total" id="crm-total"></span>
        <label class="search-field" for="crm-search"><svg><use href="#i-search"/></svg><input type="search" id="crm-search" placeholder="Search name, company, subject, ref or category" autocomplete="off"></label>
      </div>
      <div class="tscroll" id="touter">
        <table id="tbl"><thead><tr id="thead"></tr></thead><tbody id="rows"></tbody></table>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="prospect-modal" hidden>
    <section class="record-modal" role="dialog" aria-modal="true" aria-labelledby="prospect-title">
      <header class="modal-header">
        <div><p class="modal-eyebrow">CRM</p><h2 id="prospect-title">New prospect</h2></div>
        <button class="icon-button" type="button" id="prospect-close" aria-label="Close form" title="Close"><svg><use href="#i-x"/></svg></button>
      </header>
      <form id="prospect-form">
        <div class="form-grid">
          <label>First name<input name="first_name" autocomplete="off"></label>
          <label>Last name<input name="last_name" autocomplete="off"></label>
          <label class="span-2">Company<input name="company_name" autocomplete="off"></label>
          <label>Mobile<input name="mobile" autocomplete="off"></label>
          <label>Email<input name="email" type="email" autocomplete="off"></label>
          <label class="span-2">Subject<input name="subject" autocomplete="off"></label>
          <label class="span-2">Category <span class="field-note">optional</span><input name="category" autocomplete="off"></label>
        </div>
        <p class="form-error" id="prospect-error" role="alert"></p>
        <div class="form-actions">
          <button class="button button-secondary" type="button" id="prospect-cancel">Cancel</button>
          <button class="button button-primary" type="submit" id="prospect-save">Add prospect</button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/api/v1/achi/crm/crm.js?v=4"></script>
  <script src="/api/v1/achi/ui/chrome.js?v=22"></script>
</body>
</html>
