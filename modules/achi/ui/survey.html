<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Visit · Achi Scaffolding ERP</title>
<style>
  /* Site Visit workspace — /survey/ui?id=<survey id>.
     Same design as the Add Log / "+ contact" popups (log.css .rx-*, contact_info.css
     .pp-*): blue 46px header, 12px text, 26px fields with 92px labels beside them,
     sections with a thin #eef2f8 title strip, quiet × buttons, blue text links. */
  :root{
    --ink:#1d1d1f; --mut:#44546e; --soft:#8a95a8; --strip-t:#486077;
    --navy:#284f9e; --navy-d:#1f3f80; --blue-soft:#eaf1ff; --hi:#dce7fa;
    --page:#f4f6f9; --strip:#eef2f8; --box:#fbfcff;
    --line:#b9c5d8; --line-soft:#dbe2ed; --row:#eef2f8;
    --red:#b91c1c;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font:12px/1.45 var(--font);color:var(--ink);background:var(--page)!important}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--navy);text-decoration:none}
  /* chrome.js's white title bar: hidden like the other ACHI pages; on narrow
     screens it keeps the sidebar burger but drops its duplicate title. */
  body[data-achi-title="Site Visit"] .achi-top{display:none}
  @media (max-width:900px){
    body[data-achi-title="Site Visit"] .achi-top{display:flex;padding:6px 12px}
    body[data-achi-title="Site Visit"] .achi-top h1{display:none}
  }

  .page{padding:10px 12px 30px}

  /* ── header = the white CRM / Contacts banner (.bar-title) ──────────── */
  .tb{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 10px;margin-bottom:10px;
      background:#fff;border:1px solid var(--line);border-radius:5px;color:var(--ink)}
  .tb-back{color:var(--navy);font-size:11.5px;font-weight:700;text-decoration:underline;white-space:nowrap}
  .tb-back:hover{color:var(--navy-d)}
  .tb h1{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap}
  .tb-save{font-size:11px;color:var(--soft);white-space:nowrap}
  .tb-save.is-error{color:var(--red);font-weight:700}
  .tb-sp{flex:1}
  /* search = the CRM / Contacts .srch */
  .tb-search{height:26px;width:260px;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:12px}
  .tb-search::placeholder{color:var(--soft)}
  .tb-search:focus{outline:none;border-color:var(--navy)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 10px;border:1px solid var(--line);
       border-radius:4px;background:#fff;color:var(--navy-d);font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer}
  .btn:hover{background:var(--blue-soft)}
  .btn:disabled{opacity:.6;cursor:default}
  .tb .btn-new{border-color:var(--navy);color:var(--navy)}            /* blue outline on the white banner */
  .btn-danger{height:28px;padding:0 14px;border-color:#e3a9a9;color:var(--red);font-size:12px}
  .btn-danger:hover{background:#fbeaea}
  .btn-icon{width:28px;padding:0}
  .btn-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .tb .btn-icon{border-color:var(--line);background:#fff;color:var(--navy)}
  .tb-drawer{display:none}

  .err{display:none;margin:0 0 10px;padding:6px 10px;border:1px solid #e7a49e;border-left:4px solid #b9342a;border-radius:5px;background:#fff1ef;color:#8f241b;font-size:12px;font-weight:700}

  /* ── sidebar | main ──────────────────────────────────────────────────── */
  .ws{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;align-items:start}

  /* sidebar: CRM / Contacts list density */
  .side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;background:#fff;
        border:1px solid var(--line);border-radius:6px;scrollbar-width:thin}
  .side-h{position:sticky;top:0;z-index:1;padding:4px 10px;background:var(--strip);border-bottom:1px solid var(--line-soft);
          color:var(--strip-t);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:20px}
  .sv{display:block;width:100%;padding:5px 9px 6px 8px;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--row);
      background:#fff;text-align:left;cursor:pointer}
  .sv:hover{background:#f7f9fc}
  .sv.on{background:var(--blue-soft);border-left-color:var(--navy)}
  .sv-code{font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:700;color:var(--navy)}
  .sv-who{overflow:hidden;color:var(--ink);font-size:11.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
  .sv-where{overflow:hidden;color:var(--mut);font-size:10.5px;text-overflow:ellipsis;white-space:nowrap}
  .sv-tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:3px}
  .tag{display:inline-flex;align-items:center;padding:0 6px;border:1px solid var(--line-soft);border-radius:99px;background:var(--strip);color:var(--navy);font-size:8.5px;font-weight:700}
  .side-empty{padding:16px 9px;color:var(--soft);font-size:11px;text-align:center}

  /* status pills = the CRM .st badges */
  .pill{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .p-draft{background:#e5eeff;color:#1f3f80}
  .p-scheduled{background:#fff4e0;color:#8a5a08}
  .p-in-progress{background:#f3edfb;color:#5b21b6}
  .p-completed{background:#dcefe2;color:#14532d}
  .p-cancelled{background:#fbeaea;color:#b91c1c}

  /* ── sections = .pp-company with a .pp-sec-t strip ──────────────────── */
  .main{min-width:0}
  .panel{margin-bottom:12px;overflow:hidden;background:var(--box);border:1px solid var(--line);border-radius:6px}
  .panel-h{display:flex;align-items:center;gap:7px;padding:4px 8px;background:var(--strip);border-bottom:1px solid var(--line-soft)}
  .panel-h>div{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-width:0}
  .num{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:var(--navy);color:#fff;font-size:9.5px;font-weight:800}
  .panel-t{color:var(--strip-t);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .panel-s{display:flex;align-items:center;gap:5px;color:var(--soft);font-size:11px}
  .panel-s .code{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:var(--navy)}
  .panel-b{padding:8px}

  /* fields = .pp-f: 92px right-aligned label beside a 26px field */
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px 12px}
  label.f{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:0 6px;min-width:0}
  label.f>span:first-child{color:var(--mut);font-size:10.5px;font-weight:700;text-align:right;white-space:nowrap}
  label.f.f-top{grid-template-columns:minmax(0,1fr);gap:3px}
  label.f.f-top>span:first-child{text-align:left}
  .in,label.f input,label.f select,label.f textarea{width:100%;height:26px;min-width:0;padding:2px 7px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:12px}
  label.f textarea{height:90px;padding:6px 8px;font-size:12.5px;line-height:1.5;resize:vertical}
  .in:focus,label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(40,79,158,.14)}
  .with-icon{position:relative;display:flex;color:var(--ink);font-size:12px;font-weight:400;text-align:left}
  .with-icon input{padding-right:26px}
  .with-icon a{position:absolute;right:3px;top:50%;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-top:-10px;border-radius:3px;color:var(--navy)}
  .with-icon a:hover{background:var(--blue-soft)}
  .with-icon a svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* map preview from OSM tiles (CSP blocks third-party iframes) */
  .tilemap{position:relative;overflow:hidden;margin-top:8px;border:1px solid var(--line-soft);border-radius:4px;background:#e9eef4}
  .mt-tile{position:absolute;display:block;width:256px;height:256px;max-width:none}
  .maps-pin{position:absolute;left:50%;top:50%;z-index:1;color:#ef4444;transform:translate(-50%,-100%);pointer-events:none}
  .maps-pin svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}

  /* measurements = .pp-row: [Description][Value][Unit][×] */
  .mrows{display:flex;flex-direction:column;gap:4px}
  .mrow{display:grid;grid-template-columns:2fr 1fr 1fr 22px;gap:5px;align-items:center}
  .m-del{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:1px solid transparent;border-radius:4px;background:transparent;color:#6b7a92;font-size:15px;line-height:1;cursor:pointer}
  .m-del:hover{border-color:#eccaca;background:#fbeaea;color:var(--red)}
  .m-empty{color:var(--soft);font-size:11.5px}
  /* "+ Add measurement" = .pp-addlink */
  .linkbtn{margin-top:6px;padding:0;border:0;background:transparent;color:var(--navy);font-size:11px;font-weight:700;cursor:pointer}
  .linkbtn:hover{text-decoration:underline}

  /* field capture */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
  .sub-t{margin:10px 0 4px;color:var(--strip-t);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  /* drop zone = the Add Log attachment drop */
  .drop{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;padding:9px;border:1.5px dashed var(--line);border-radius:4px;background:#fff;color:var(--mut);text-align:center;cursor:pointer}
  .drop:hover,.drop.is-over{border-color:var(--navy);background:#f6f9ff;color:var(--navy)}
  .drop svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .drop b{color:var(--navy);font-size:11.5px;font-weight:700}
  .drop small{font-size:10.5px}
  .files{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .file{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 3px;border:1px solid var(--line-soft);border-radius:4px;background:#fff;font-size:11px}
  .file-thumb{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:26px;height:26px;overflow:hidden;border-radius:3px;background:var(--strip);color:var(--navy);font-size:8.5px;font-weight:800}
  .file-thumb img{width:100%;height:100%;object-fit:cover}
  .file-nm{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-sz{color:var(--mut);white-space:nowrap}
  .file .btn{height:22px;padding:0 7px;font-size:10.5px}
  .file .btn-danger{height:22px;padding:0 7px;font-size:10.5px}
  .draw-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:4px;background:#fff}
  .draw-txt{flex:1;color:var(--mut);font-size:11.5px}
  .draw-txt b{color:var(--ink);font-weight:700}
  /* Save bar: bottom of the page, stays in view while scrolling the form. */
  .savebar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;
    border:1px solid var(--line);border-radius:5px;background:#fff;box-shadow:0 -2px 8px rgba(29,29,31,.06)}
  .savebar-sp{flex:1}
  .savebar-msg{color:var(--mut);font-size:11px}
  .btn-save{height:28px;padding:0 18px;border-color:var(--navy);background:var(--navy);color:#fff;font-size:12px;font-weight:700}
  .btn-save:hover{background:#1f3f80}
  .btn-save:disabled{opacity:.5}

  .placeholder{padding:24px 10px;color:var(--mut);text-align:center;font-size:12px}

  /* ── responsive ──────────────────────────────────────────────────────── */
  @media (max-width:1100px){ .ws{grid-template-columns:240px minmax(0,1fr)} }
  @media (max-width:1050px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} .tb-search{width:200px} }
  @media (max-width:900px){
    .ws{grid-template-columns:1fr}
    .side{position:fixed;top:0;left:0;bottom:0;z-index:40;width:min(280px,86vw);max-height:none;border-radius:0;transform:translateX(-102%);transition:transform .18s ease}
    body.drawer-open .side{transform:none}
    .scrim{position:fixed;inset:0;z-index:35;background:rgba(15,23,42,.35)}
    .tb-drawer{display:inline-flex}
    .tb-save{display:none}
  }
  @media (max-width:640px){
    .page{padding:8px}
    .tb{flex-wrap:wrap}
    .tb-search{width:auto;flex:1;min-width:0}
    .grid,.two{grid-template-columns:1fr}
    .mrow{grid-template-columns:1fr 1fr 22px}
    .mrow .in[data-mk="label"]{grid-column:1 / -1}
  }
  @media (prefers-reduced-motion:reduce){ .side{transition:none} }
</style>
</head>
<body data-achi-title="Site Visit">
<div class="page">
<header class="tb">
  <button class="btn btn-icon tb-drawer" id="drawer-btn" type="button" aria-label="Show site visits" title="Site visits">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="tb-back" href="/api/v1/achi/survey/ui" id="back">‹ All site visits</a>
  <h1>Site Visit</h1>
  <span class="tb-save" id="save-state" aria-live="polite"></span>
  <span class="tb-sp"></span>
  <input class="tb-search" id="q" type="search" placeholder="Search site, name, number..." autocomplete="off" aria-label="Search site visits">
  <button class="btn btn-new" id="new-visit" type="button">+ New visit</button>
</header>
<div class="err" id="err"></div>

<div class="ws">
  <aside class="side" id="side" aria-label="Site visits">
    <div class="side-h" id="side-h">Surveys</div>
    <div id="list"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="detail"></main>
</div>
</div>


<script src="/api/v1/achi/ui/drawing.js?v=2"></script>
<script>
/* Same-origin as the SPA, so the JWT it stored is ours to reuse. */
const isJwt=s=>typeof s==='string'&&/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(s);
function jwtPayload(t){
  try{ let p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4) p+='=';
    return JSON.parse(atob(p)); }catch(e){ return null; }
}
/* Both tokens this API issues are JWTs; anything typed "refresh" is excluded so
   a refresh token in storage is never sent as a bearer (every call would 401). */
const isAccessJwt=s=>isJwt(s)&&(jwtPayload(s)||{}).type!=='refresh';
function scanStorage(match){
  for(const st of [localStorage,sessionStorage]){
    for(let i=0;i<st.length;i++){ const v=st.getItem(st.key(i));
      if(match(v))return v;
      if(v&&v[0]==='{'){ try{const o=JSON.parse(v);
        for(const c of [o.access_token,o.refresh_token,o.token,o.state&&o.state.access_token,o.state&&o.state.refresh_token,o.state&&o.state.token])
          if(match(c))return c;
      }catch(e){} } }
  }
  return null;
}
function getToken(){
  const d=localStorage.getItem('oe_access_token'); if(isAccessJwt(d))return d;
  return scanStorage(isAccessJwt);
}
function getRefreshToken(){
  const d=localStorage.getItem('oe_refresh_token'); if(isJwt(d))return d;
  return scanStorage(s=>isJwt(s)&&(jwtPayload(s)||{}).type==='refresh');
}
let TOKEN=getToken();   // reassigned by refreshToken() when the access token expires
const API='/api/v1/achi';
const LIST_URL=`${API}/survey/ui`;            // the Site Visit list (no ?id)
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fail=m=>{const e=$('err');e.textContent=m;e.style.display='block';};
const clearErr=()=>{$('err').style.display='none';};

/* Access tokens last an hour: swap the refresh token for a new one and retry
   once. Shared promise so a burst of 401s triggers one refresh. */
let refreshing=null;
function refreshToken(){
  if(refreshing) return refreshing;
  const rt=getRefreshToken();
  if(!rt) return Promise.resolve(false);
  refreshing=fetch('/api/v1/users/auth/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d&&d.access_token){ TOKEN=d.access_token;
      try{ localStorage.setItem('oe_access_token',TOKEN); if(d.refresh_token) localStorage.setItem('oe_refresh_token',d.refresh_token); }catch(e){}
      return true; } return false; })
    .catch(()=>false)
    .finally(()=>{ refreshing=null; });
  return refreshing;
}
/* Attachment upload/download need the raw Response (FormData in, blob out). */
async function authFetch(url,opts={},retried){
  const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+TOKEN,...(opts.headers||{})}});
  if(r.status===401 && !retried && await refreshToken()) return authFetch(url,opts,true);
  return r;
}
async function api(path,opts={},retried){
  const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN,...(opts.headers||{})}});
  if(r.status===401){
    if(!retried && await refreshToken()) return api(path,opts,true);
    const m='Session expired — open the main app on this host, sign in, then reload.';
    fail(m); throw new Error(m); }
  if(r.status===204) return {};
  const b=await r.json().catch(()=>({}));
  if(!r.ok){ const d=b.detail; throw new Error(Array.isArray(d)?d.map(x=>x.msg).join('; '):(d||r.status)); }
  return b;
}

const ICON={
  ext:'<svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  upload:'<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>',
};
const SVGpin=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

/* Map preview from OSM tiles as <img> (the page CSP blocks third-party frames). */
function mapsCoords(url){
  const pats=[/@(-?\d+\.?\d*),\+?(-?\d+\.?\d*)/,/\/maps\/search\/(-?\d+\.?\d*),\+?(-?\d+\.?\d*)/,/[?&]q=(-?\d+\.?\d*),\+?(-?\d+\.?\d*)/,/[?&]ll=(-?\d+\.?\d*),\+?(-?\d+\.?\d*)/];
  for(const p of pats){ const m=String(url||'').match(p); if(m) return {lat:parseFloat(m[1]),lng:parseFloat(m[2])}; }
  return null;
}
function tileMap(lat,lng,W,H,z){
  const n=Math.pow(2,z), wx=((lng+180)/360)*n*256, s=Math.sin(lat*Math.PI/180);
  const wy=(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n*256;
  const tlX=wx-W/2, tlY=wy-H/2; let out='';
  for(let tx=Math.floor(tlX/256); tx*256<tlX+W; tx++)
    for(let ty=Math.floor(tlY/256); ty*256<tlY+H; ty++){
      if(ty<0||ty>=n) continue; const xx=((tx%n)+n)%n;
      out+=`<img class="mt-tile" src="/api/v1/achi/tile/${z}/${xx}/${ty}" style="left:${Math.round(tx*256-tlX)}px;top:${Math.round(ty*256-tlY)}px" alt="" loading="lazy">`;
    }
  return `<div class="tilemap" style="width:100%;max-width:${W}px;height:${H}px">${out}<span class="maps-pin">${SVGpin}</span></div>`;
}
const isUrl=v=>/^https?:\/\/\S+$/i.test(String(v||'').trim());

/* ── state ── */
let ROWS=[];          // sidebar: GET /site-visits/ (SV code, status, contact, site, counts)
let current=null;     // the working copy of the open visit (edited on the page, saved by Save)
let isNew=false;      // a "+ New visit" that has not been saved yet (?id=new)
let dirty=false;      // unsaved changes on the page
let drawingDraft=null;// sketch made since the last save (sent with Save), else null
let shots=[];         // its attachments (saved visits)
let pendingFiles=[];  // photos / PDFs picked on a new visit, uploaded by Save
let drawingShapes=0;  // shapes in its sketch (for the Drawing line)
const NEW_ID='new';
const SURVEY_STATUSES=['Draft','Scheduled','In Progress','Completed','Cancelled'];
const SITE_TYPES=['','Residential','Commercial','Industrial'];
const ROOF_TYPES=['','Flat','Pitched','Mixed','N/A'];
const MEASUREMENT_UNITS=['m','m²','m³','cm','mm','ft','in','kg','g','L','mL','pcs','units'];
// Fields Save sends (SurveyCreate / SurveyUpdate).
const FIELDS=['status','survey_date','assigned_to','customer','lead','lead_mobile','site_location','google_maps_url','site_type','roof_type','site_area','notes','updates'];
const pillClass=s=>'p-'+String(s||'Draft').toLowerCase().replace(/\s+/g,'-');
const pill=s=>`<span class="pill ${pillClass(s)}">${esc(s||'Draft')}</span>`;
const opts=(items,value)=>items.map(v=>`<option value="${esc(v)}"${v===String(value||'')?' selected':''}>${esc(v||'—')}</option>`).join('');
/* SV-00018 from ACHI-SV-2026-00018 — same as the list and the API. */
const svCode=n=>{ const m=String(n||'').match(/-(\d+)$/); return m?`SV-${m[1].padStart(5,'0')}`:String(n||''); };
const urlId=()=>new URLSearchParams(location.search).get('id');
const blankVisit=()=>({id:null,survey_number:'',status:'Draft',measurements:[],has_drawing:0});

/* ── save state in the header ── */
function setSave(kind){
  const el=$('save-state');
  el.className='tb-save'+(kind==='error'?' is-error':'');
  el.textContent=kind==='saving'?'Saving…':kind==='error'?'Couldn’t save':kind==='saved'?'Saved'
    :kind==='dirty'?'Unsaved changes':'';
}
function markDirty(){ if(!dirty){ dirty=true; setSave('dirty'); renderSaveBar(); } }
/* Nothing is lost by accident: confirm before leaving unsaved changes. */
const leaveOk=()=>!dirty||confirm('You have unsaved changes on this site visit. Leave without saving?');
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* ── sidebar ── */
async function loadRows(){ ROWS=await api('/site-visits/'); renderList(); }
let sideTimer=null;
function refreshSidebarSoon(){ clearTimeout(sideTimer); sideTimer=setTimeout(()=>loadRows().catch(()=>{}),400); }
function renderList(){
  const q=$('q').value.trim().toLowerCase();
  const rows=q?ROWS.filter(r=>[r.code,r.survey_number,r.status,r.contact_name,r.company,r.site,r.enq_code,r.assigned_to]
    .some(v=>String(v||'').toLowerCase().includes(q))):ROWS;
  $('side-h').textContent=`Surveys · ${rows.length}`;
  // An unsaved "+ New visit" sits on top, selected, until it is saved.
  const draftRow=isNew?`<button class="sv on" type="button" aria-current="true" disabled>
      <div class="sv-code">NEW</div>
      <div class="sv-who">${esc(current&&current.customer||'New site visit')}</div>
      <div class="sv-where">Not saved yet</div>
      <div class="sv-tags">${pill(current?current.status:'Draft')}</div>
    </button>`:'';
  $('list').innerHTML=draftRow+(rows.length?rows.map(r=>`
    <button class="sv${current&&current.id===r.id?' on':''}" data-id="${esc(r.id)}" type="button"${current&&current.id===r.id?' aria-current="true"':''}>
      <div class="sv-code">${esc(r.code)}</div>
      <div class="sv-who">${esc(r.contact_name||'Unnamed survey')}</div>
      <div class="sv-where">${esc(r.site||'No location yet')}</div>
      <div class="sv-tags">${pill(r.status)}
        ${r.measurement_count?'<span class="tag">measurements</span>':''}
        ${r.has_drawing?'<span class="tag">sketch</span>':''}
        ${r.photo_count?`<span class="tag">${r.photo_count} file${r.photo_count===1?'':'s'}</span>`:''}
      </div>
    </button>`).join(''):(isNew?'':`<div class="side-empty">${q?'No site visits match.':'No site visits yet.'}</div>`));
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.sv[data-id]'); if(!b) return;
  closeDrawer();
  if(current&&current.id===b.dataset.id) return;
  if(!leaveOk()) return;
  openVisit(b.dataset.id,{push:true});
});


/* ── navigation: the URL is the open visit (?id=…, or ?id=new before the
   first save); Back/Forward follow it ── */
function resetEditState(){ dirty=false; drawingDraft=null; drawingShapes=0; setSave(''); }
function openNew({push=false}={}){
  if(push) history.pushState({id:NEW_ID},'',`${LIST_URL}?id=${NEW_ID}`);
  resetEditState();
  isNew=true; current=blankVisit(); shots=[]; pendingFiles=[];
  clearErr(); renderDetail(); renderList();
  document.title='New site visit · Site Visit · Achi Scaffolding ERP';
  window.scrollTo(0,0);
}
async function openVisit(id,{push=false}={}){
  if(id===NEW_ID){ openNew({push}); return; }
  if(push) history.pushState({id},'',`${LIST_URL}?id=${encodeURIComponent(id)}`);
  resetEditState(); isNew=false; pendingFiles=[];
  try{
    const [s,att]=await Promise.all([api('/surveys/'+id),api(`/surveys/${id}/attachments`)]);
    current=s; shots=att;
    clearErr(); renderDetail(); renderList();
    document.title=`${svCode(s.survey_number)} · Site Visit · Achi Scaffolding ERP`;
    window.scrollTo(0,0);
    if(s.has_drawing) countDrawing(id);
  }catch(e){
    current=null; renderList();
    $('detail').innerHTML=`<div class="panel placeholder">This site visit could not be opened — it may have been deleted.<br><br><a href="${LIST_URL}">← Back to all site visits</a></div>`;
  }
}
window.addEventListener('popstate',()=>{
  dirty=false;                                   // the browser already moved on
  const id=urlId();
  if(id) openVisit(id); else location.replace(LIST_URL);   // back to the list page
});
$('back').addEventListener('click',e=>{ if(!leaveOk()) e.preventDefault(); else dirty=false; });

/* ── editor ── */
function rowFor(id){ return ROWS.find(r=>r.id===id)||null; }
function renderDetail(){
  const s=current, row=s.id?rowFor(s.id):null, c=mapsCoords(s.google_maps_url);
  const enq=row&&row.enq_code?row.enq_code:(s.file_id?s.lead:'');
  const hasSketch=drawingDraft!==null?drawingShapes>0:Boolean(s.has_drawing);
  const ref=isNew?'<span class="code">New — not saved yet</span>':`<span class="code">${esc(svCode(s.survey_number))}</span>`;
  $('detail').innerHTML=`
  <section class="panel">
    <div class="panel-h"><span class="num">1</span><div><div class="panel-t">Assignment</div>
      <div class="panel-s">${ref}·${pill(s.status)}</div></div></div>
    <div class="panel-b grid">
      <label class="f"><span>Status</span><select data-f="status">${opts(SURVEY_STATUSES,s.status)}</select></label>
      <label class="f"><span>Survey Date</span><input type="date" data-f="survey_date" value="${esc(s.survey_date||'')}"></label>
      <label class="f"><span>Surveyor</span><input data-f="assigned_to" value="${esc(s.assigned_to||'')}"></label>
      <label class="f"><span>Customer</span><input data-f="customer" value="${esc(s.customer||'')}"></label>
      <label class="f"><span>Lead</span><input data-f="lead" value="${esc(s.lead||enq||'')}" placeholder="ENQ / lead reference"></label>
      <label class="f"><span>Contact</span><input type="tel" inputmode="tel" maxlength="32" data-f="lead_mobile" value="${esc(s.lead_mobile||'')}" placeholder="Phone number"></label>
    </div>
  </section>

  <section class="panel">
    <div class="panel-h"><span class="num">2</span><div><div class="panel-t">Site Info</div>
      <div class="panel-s">Physical characteristics of the survey site</div></div></div>
    <div class="panel-b">
      <div class="grid">
        <label class="f"><span>Site Location</span><input data-f="site_location" value="${esc(s.site_location||'')}" placeholder="Area, street, building"></label>
        <label class="f"><span>Maps</span><span class="with-icon"><input data-f="google_maps_url" value="${esc(s.google_maps_url||'')}" placeholder="Paste a Google Maps link">${isUrl(s.google_maps_url)?`<a href="${esc(s.google_maps_url)}" target="_blank" rel="noreferrer" title="Open in Maps" aria-label="Open in Maps">${ICON.ext}</a>`:''}</span></label>
        <label class="f"><span>Site Type</span><select data-f="site_type">${opts(SITE_TYPES,s.site_type)}</select></label>
        <label class="f"><span>Roof Type</span><select data-f="roof_type">${opts(ROOF_TYPES,s.roof_type)}</select></label>
        <label class="f"><span>Area (m²)</span><input type="number" min="0" step="any" data-f="site_area" value="${esc(s.site_area??'')}"></label>
      </div>
      ${c?tileMap(c.lat,c.lng,520,170,16):''}
    </div>
  </section>

  <section class="panel">
    <div class="panel-h"><span class="num">3</span><div><div class="panel-t">Measurements</div>
      <div class="panel-s">Description, value and unit — matching the Frappe child table</div></div></div>
    <div class="panel-b">
      <div class="mrows" id="measurements">${(s.measurements||[]).length?s.measurements.map((m,i)=>`
        <div class="mrow measurement-row" data-mi="${i}">
          <input class="in" data-mk="label" value="${esc(m.label||'')}" placeholder="Description">
          <input class="in" data-mk="value" type="number" step="any" value="${esc(m.value??'')}" placeholder="Value">
          <select class="in" data-mk="unit">${opts(MEASUREMENT_UNITS,m.unit)}</select>
          <button class="m-del" type="button" data-md="${i}" title="Remove measurement" aria-label="Remove measurement">&times;</button>
        </div>`).join(''):'<div class="m-empty">No measurements yet.</div>'}</div>
      <button class="linkbtn" id="add-measurement" type="button">+ Add measurement</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-h"><span class="num">4</span><div><div class="panel-t">Field Capture</div>
      <div class="panel-s">Notes, updates, drawing, photos and files</div></div></div>
    <div class="panel-b">
      <div class="two">
        <label class="f f-top"><span>Site Notes</span><textarea data-f="notes" placeholder="Add notes about the site...">${esc(s.notes||'')}</textarea></label>
        <label class="f f-top"><span>Updates</span><textarea data-f="updates">${esc(s.updates||'')}</textarea></label>
      </div>
      <div class="sub-t">Photos and files</div>
      <div class="drop" id="drop" role="button" tabindex="0">${ICON.upload}<b>Tap to add photos or a PDF</b><small>${isNew?'or drop files here — uploaded when you save':'or drop files here'}</small></div>
      <input type="file" id="file" multiple accept="image/*,application/pdf" hidden>
      <div class="files" id="shots"></div>
      <div class="sub-t">Drawing</div>
      <div class="draw-row"><span class="draw-txt" id="draw-txt">${drawingText(hasSketch)}</span>
        <button class="btn" id="draw" type="button">${hasSketch?'Edit drawing':'Add drawing'}</button></div>
    </div>
  </section>

  <div class="savebar" id="savebar"></div>`;
  wireDetail(); renderShots(); renderSaveBar();
}
function drawingText(hasSketch){
  if(drawingDraft!==null) return hasSketch?`<b>Sketch ready</b> · ${drawingShapes} shape${drawingShapes===1?'':'s'} — saved with the visit`:'No drawing yet';
  if(!hasSketch) return 'No drawing yet';
  return drawingShapes?`<b>Sketch saved</b> · ${drawingShapes} shape${drawingShapes===1?'':'s'}`:'<b>Sketch saved</b>';
}
const shapesIn=json=>{ let doc=null; try{ doc=JSON.parse(json||'null'); }catch(e){}
  return (Array.isArray(doc)?doc:(doc&&Array.isArray(doc.shapes)?doc.shapes:[])).length; };
async function countDrawing(id){
  try{
    const d=await api(`/surveys/${id}/drawing`);
    drawingShapes=shapesIn(d.drawing);
    if(current&&current.id===id&&drawingDraft===null&&$('draw-txt')) $('draw-txt').innerHTML=drawingText(true);
  }catch(e){}
}

/* The bar at the bottom: Save (creates a new visit / saves edits), plus
   Cancel for a new one or Delete survey for a saved one. */
function renderSaveBar(){
  const bar=$('savebar'); if(!bar) return;
  bar.innerHTML=`${isNew
      ? '<button class="btn" id="cancel-new" type="button">Cancel</button>'
      : '<button class="btn btn-danger" id="del" type="button">Delete survey</button>'}
    <span class="savebar-sp"></span>
    <span class="savebar-msg">${dirty?'Unsaved changes':isNew?'Not saved yet':''}</span>
    <button class="btn btn-save" id="save" type="button"${!dirty&&!isNew?' disabled':''}>${isNew?'Save visit':'Save'}</button>`;
  $('save').onclick=saveVisit;
  if(isNew) $('cancel-new').onclick=()=>{ if(leaveOk()){ dirty=false; location.href=LIST_URL; } };
  else $('del').onclick=async()=>{
    if(!confirm(`Delete ${svCode(current.survey_number)}? This cannot be undone.`)) return;
    try{ await api('/surveys/'+current.id,{method:'DELETE'}); dirty=false; location.href=LIST_URL; }catch(e){ fail(e.message); }
  };
}

/* Edits change the working copy only; Save sends them. */
function wireDetail(){
  $('detail').querySelectorAll('[data-f]').forEach(el=>{
    const take=()=>{
      const f=el.dataset.f; let v=el.value;
      if(f==='site_area') v=v===''?null:Number(v);
      if((current[f]??'')===(v??'')) return;
      current[f]=v===''?null:v;
      markDirty();
      // the status pill / map link / map preview follow these fields
      if(f==='status'||f==='google_maps_url'){ renderDetail(); if(isNew) renderList(); }
      else if(isNew&&f==='customer') renderList();
    };
    el.addEventListener('input',()=>{ if(el.tagName!=='SELECT') markDirty(); });
    el.addEventListener('change',take);
    el.addEventListener('blur',take);
  });
  const readMeasurements=()=>[...$('detail').querySelectorAll('.measurement-row')].map(row=>{
    const get=k=>row.querySelector(`[data-mk="${k}"]`).value;
    return {label:get('label')||null,value:get('value')===''?null:Number(get('value')),unit:get('unit')||null};
  });
  const takeMeasurements=()=>{ current.measurements=readMeasurements(); markDirty(); };
  $('detail').querySelectorAll('.measurement-row input,.measurement-row select').forEach(el=>{
    el.addEventListener('input',markDirty);
    el.addEventListener('change',takeMeasurements);
  });
  $('detail').querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{
    current.measurements=readMeasurements().filter((_,i)=>i!==+b.dataset.md);
    markDirty(); renderDetail();
  });
  $('add-measurement').onclick=()=>{
    current.measurements=[...readMeasurements(),{label:null,value:null,unit:'m'}];
    markDirty(); renderDetail();
    const rows=$('detail').querySelectorAll('.measurement-row');
    rows[rows.length-1]?.querySelector('[data-mk="label"]')?.focus();
  };
  const drop=$('drop');
  if(drop){
    drop.onclick=()=>$('file').click();
    drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('file').click(); } };
    drop.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('is-over');});
    drop.addEventListener('dragleave',()=>drop.classList.remove('is-over'));
    drop.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('is-over'); upload(e.dataTransfer.files);});
    $('file').onchange=e=>{ upload(e.target.files); e.target.value=''; };
  }
  $('draw').onclick=async()=>{
    if(typeof achi_drawing==='undefined'){ fail('Drawing tool did not load.'); return; }
    let initial=drawingDraft!==null?drawingDraft:'';
    if(drawingDraft===null&&current.id){ try{ initial=(await api(`/surveys/${current.id}/drawing`)).drawing||''; }catch(e){} }
    const name=isNew?'new site visit':svCode(current.survey_number);
    achi_drawing.open({ title:`Sketch — ${name}`, initial,
      onSave:json=>{ drawingDraft=json; drawingShapes=shapesIn(json); markDirty(); renderDetail(); } });
  };
}

/* ── Save: POST /surveys/ for a new visit, PATCH /surveys/{id} for edits ── */
async function saveVisit(){
  // take whatever is in a field that still has focus
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  const m=[...$('detail').querySelectorAll('.measurement-row')].map(row=>{
    const get=k=>row.querySelector(`[data-mk="${k}"]`).value;
    return {label:get('label')||null,value:get('value')===''?null:Number(get('value')),unit:get('unit')||null};
  });
  const body={measurements:m};
  FIELDS.forEach(f=>{
    const v=current[f];
    body[f]=v===''||v===undefined?null:v;
  });
  if(!body.status) body.status='Draft';
  if(drawingDraft!==null) body.drawing=drawingDraft;
  const btn=$('save'); if(btn) btn.disabled=true;
  setSave('saving');
  try{
    const saved=isNew
      ? await api('/surveys/',{method:'POST',body:JSON.stringify(body)})
      : await api('/surveys/'+current.id,{method:'PATCH',body:JSON.stringify(body)});
    if(isNew){
      const failed=await uploadPending(saved.id);
      dirty=false;
      if(!failed.length){ location.href=LIST_URL; return; }   // back to the table, with the new visit in it
      // The visit is saved but some files were not: stay on it so they can be re-added.
      fail(`Saved, but these files did not upload: ${failed.join(', ')}`);
      shots=await api(`/surveys/${saved.id}/attachments`).catch(()=>[]);
    }
    const wasNew=isNew;
    current=saved; isNew=false; dirty=false; drawingDraft=null; pendingFiles=[];
    if(wasNew){
      history.replaceState({id:saved.id},'',`${LIST_URL}?id=${encodeURIComponent(saved.id)}`);
      document.title=`${svCode(saved.survey_number)} · Site Visit · Achi Scaffolding ERP`;
    } else clearErr();
    setSave('saved');
    await loadRows().catch(()=>{});
    renderDetail(); renderList();
    if(saved.has_drawing) countDrawing(saved.id);
  }catch(e){
    setSave('error'); fail(e.message);
    if(btn) btn.disabled=false;
  }
}

/* ── photos and PDFs (existing attachment endpoints). On a saved visit they
   upload straight away; on a new one they wait here until Save. ── */
async function sendFile(id,f){
  const fd=new FormData(); fd.append('file',f,f.name);
  const r=await authFetch(`${API}/surveys/${id}/attachments`,{method:'POST',body:fd});
  if(!r.ok){ const b=await r.json().catch(()=>({})); throw new Error(b.detail||`Could not upload ${f.name}`); }
}
async function uploadPending(id){
  const failed=[];
  for(const p of pendingFiles){ try{ await sendFile(id,p.file); }catch(e){ failed.push(p.file.name); } }
  pendingFiles.forEach(p=>p.url&&URL.revokeObjectURL(p.url));
  return failed;
}
async function upload(files){
  if(!files||!files.length) return;
  clearErr();
  if(isNew){
    for(const f of files) pendingFiles.push({file:f,url:f.type.startsWith('image/')?URL.createObjectURL(f):null});
    markDirty(); renderShots(); return;
  }
  for(const f of files){
    try{ await sendFile(current.id,f); }catch(e){ fail(e.message); }
  }
  shots=await api(`/surveys/${current.id}/attachments`);
  renderShots(); refreshSidebarSoon();
}
const fmtSize=b=>{ b=+b||0; return b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?Math.round(b/1024)+' KB':b+' B'; };
async function openAttachment(a,download){
  try{ const r=await authFetch(`${API}/survey-attachments/${a.id}/download`);
    if(!r.ok) return;
    const url=URL.createObjectURL(await r.blob());
    if(download){ const link=document.createElement('a'); link.href=url; link.download=a.filename||'file'; link.click(); }
    else window.open(url,'_blank');
  }catch(e){}
}
function renderShots(){
  const el=$('shots'); if(!el) return;
  const pending=pendingFiles.map((p,i)=>{
    const ext=String(p.file.name).split('.').pop().toUpperCase().slice(0,4);
    return `<div class="file">
      <span class="file-thumb">${p.url?`<img src="${esc(p.url)}" alt="">`:esc(ext||'FILE')}</span>
      <span class="file-nm" title="${esc(p.file.name)}">${esc(p.file.name)}</span>
      <span class="file-sz">${fmtSize(p.file.size)} · not uploaded yet</span>
      <button class="btn btn-danger" type="button" data-unpick="${i}" title="Remove">Remove</button>
    </div>`; }).join('');
  el.innerHTML=pending+shots.map(a=>{
    const img=String(a.content_type||'').startsWith('image/');
    const ext=String(a.filename||'').split('.').pop().toUpperCase().slice(0,4);
    return `<div class="file" data-id="${esc(a.id)}">
      <span class="file-thumb">${img?`<img data-src="${esc(a.id)}" alt="">`:esc(ext||'FILE')}</span>
      <span class="file-nm" title="${esc(a.label||a.filename)}">${esc(a.label||a.filename)}</span>
      <span class="file-sz">${fmtSize(a.size_bytes)}</span>
      <button class="btn" type="button" data-open="${esc(a.id)}">Open</button>
      <button class="btn" type="button" data-dl="${esc(a.id)}" title="Download">Download</button>
      <button class="btn btn-danger" type="button" data-del="${esc(a.id)}" title="Remove">Remove</button>
    </div>`; }).join('');
  // The download route is bearer-only, so an <img src> would 401: fetch with
  // the token and hand the browser a blob.
  el.querySelectorAll('img[data-src]').forEach(async img=>{
    try{ const r=await authFetch(`${API}/survey-attachments/${img.dataset.src}/download`);
      if(r.ok) img.src=URL.createObjectURL(await r.blob()); }catch(e){}
  });
  el.querySelectorAll('[data-unpick]').forEach(b=>b.onclick=()=>{
    const [p]=pendingFiles.splice(+b.dataset.unpick,1);
    if(p&&p.url) URL.revokeObjectURL(p.url);
    renderShots();
  });
  const find=id=>shots.find(x=>x.id===id);
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ const a=find(b.dataset.open); if(a) openAttachment(a,false); });
  el.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{ const a=find(b.dataset.dl); if(a) openAttachment(a,true); });
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const a=find(b.dataset.del);
    if(!a||!confirm(`Remove ${a.label||a.filename}?`)) return;
    try{ await api(`/survey-attachments/${a.id}`,{method:'DELETE'});
      shots=await api(`/surveys/${current.id}/attachments`); renderShots(); refreshSidebarSoon();
    }catch(e){ fail(e.message); }
  });
}

/* ── + New visit: an empty form — nothing is created until Save ── */
$('new-visit').onclick=()=>{
  if(isNew) return;
  if(!leaveOk()) return;
  openNew({push:true});
};
$('q').oninput=renderList;

/* ── phone: the sidebar is a drawer ── */
function closeDrawer(){ document.body.classList.remove('drawer-open'); $('scrim').hidden=true; }
$('drawer-btn').onclick=()=>{ document.body.classList.add('drawer-open'); $('scrim').hidden=false; };
$('scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* ── boot ── */
(async()=>{
  if(!TOKEN){ fail('Not signed in on this host. Open the main app at THIS address, sign in, then reload.'); return; }
  const id=urlId();
  if(!id){ location.replace(LIST_URL); return; }      // no visit chosen: the list
  history.replaceState({id},'',location.href);
  try{ await loadRows(); }catch(e){ fail(e.message); }
  await openVisit(id);
})();
</script>
